services:
  postgres:
    image: postgres:16
    container_name: api-postgres
    profiles: ["real"]
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workoutdb}
      POSTGRES_USER: ${POSTGRES_USER:-workout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workout_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-workout_user} -d ${POSTGRES_DB:-workoutdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend-app/apiModule/ApiModule/WebApplication1
      dockerfile: Dockerfile
    container_name: api-backend
    profiles: ["real"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-workoutdb};Username=${POSTGRES_USER:-workout_user};Password=${POSTGRES_PASSWORD:-workout_pass}
      Jwt__Issuer: ${Jwt__Issuer:-ApiModule}
      Jwt__Audience: ${Jwt__Audience:-ApiModule.Client}
      Jwt__Key: ${Jwt__Key:-dev-only-change-me-to-at-least-32-characters}
      Jwt__ExpiresMinutes: ${Jwt__ExpiresMinutes:-120}
    ports:
      - "5064:8080"

  frontend-real:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: api-frontend-real
    profiles: ["real"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE_REAL:-real}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_REAL:-http://backend:8080/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  frontend-mock:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: api-frontend-mock
    profiles: ["mock"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE_MOCK:-mock}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_MOCK:-http://localhost:5064/api}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
