services:
  postgres:
    image: postgres:16
    container_name: api-postgres
    profiles: ["real"]
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workoutdb}
      POSTGRES_USER: ${POSTGRES_USER:-workout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workout_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-workout_user} -d ${POSTGRES_DB:-workoutdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend-app
      dockerfile: apiModule/ApiModule/WebApplication1/Dockerfile
    container_name: api-backend
    profiles: ["real"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-workoutdb};Username=${POSTGRES_USER:-workout_user};Password=${POSTGRES_PASSWORD:-workout_pass}
      Jwt__Issuer: ${Jwt__Issuer:-ApiModule}
      Jwt__Audience: ${Jwt__Audience:-ApiModule.Client}
      Jwt__Key: ${Jwt__Key:-dev-only-change-me-to-at-least-32-characters}
      Jwt__ExpiresMinutes: ${Jwt__ExpiresMinutes:-120}
      FormAnalysis__TimeoutSeconds: ${FORM_ANALYSIS_TIMEOUT_SECONDS:-300}
      FormAnalysis__MaxVideoMegabytes: ${FORM_ANALYSIS_MAX_VIDEO_MEGABYTES:-250}
      FormAnalysis__MaxAnalysesPerUser: ${FORM_ANALYSIS_MAX_ANALYSES_PER_USER:-50}
      FormAnalysis__RetentionDays: ${FORM_ANALYSIS_RETENTION_DAYS:-30}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - form_analysis_data:/app/App_Data/form-analysis
    ports:
      - "5064:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend-real:
    image: sportapp-frontend:real
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: real
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_REAL:-http://localhost:5064/api}
    container_name: api-frontend-real
    profiles: ["real"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', r => { r.resume(); process.exit(r.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend-mock:
    image: sportapp-frontend:mock
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: mock
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_MOCK:-http://localhost:5064/api}
    container_name: api-frontend-mock
    profiles: ["mock"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', r => { r.resume(); process.exit(r.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  form_analysis_data:
