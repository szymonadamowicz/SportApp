name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_MODE: mock
      NEXT_PUBLIC_API_URL: http://localhost:5064/api
    defaults:
      run:
        working-directory: frontend-app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore backend tests
        run: dotnet restore backend-app/apiModule/ApiModule/WebApplication1.Tests/WebApplication1.Tests.csproj

      - name: Test backend
        run: dotnet test backend-app/apiModule/ApiModule/WebApplication1.Tests/WebApplication1.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload backend test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend-app/apiModule/ApiModule/WebApplication1.Tests/TestResults/*.trx

  docker-compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose profiles
        run: |
          docker compose --profile mock config --quiet
          docker compose --profile real config --quiet
