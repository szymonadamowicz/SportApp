<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081015" />
    <title>RepForge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(52, 211, 153, 0.14), transparent 34%),
          linear-gradient(225deg, rgba(56, 189, 248, 0.12), transparent 38%),
          #081015;
        color: #f2f6f8;
      }

      main {
        max-width: 420px;
        border: 1px solid rgba(155, 180, 198, 0.18);
        border-radius: 18px;
        background: rgba(16, 24, 32, 0.86);
        padding: 24px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      p {
        margin: 0;
        color: #a8b5c2;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RepForge</h1>
      <p>
        Mobile shell is ready. Set CAPACITOR_SERVER_URL to your local or hosted
        web app URL, then run Capacitor sync/open for Android.
      </p>
    </main>
  </body>
</html>
